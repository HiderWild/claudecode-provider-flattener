name: release-macos

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            asset_suffix: macos-arm64
            build_dir: build-macos-arm64
          - runner: macos-15-intel
            asset_suffix: macos-intel
            build_dir: build-macos-intel

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Compute asset names
        id: names
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            version="${{ github.ref_name }}"
          else
            version="manual-${{ github.run_number }}"
          fi
          asset_stem="claudecode-provider-flattener-${version}-${{ matrix.asset_suffix }}"
          echo "ASSET_STEM=$asset_stem" >> "$GITHUB_ENV"
          echo "asset_stem=$asset_stem" >> "$GITHUB_OUTPUT"

      - name: Configure CMake
        run: cmake -B "${{ matrix.build_dir }}" -S . -DCMAKE_BUILD_TYPE=Release

      - name: Build Release
        run: cmake --build "${{ matrix.build_dir }}" --parallel

      - name: Run tests
        run: ctest --test-dir "${{ matrix.build_dir }}" --output-on-failure

      - name: Prepare package
        run: |
          mkdir -p dist
          install -m 755 "${{ matrix.build_dir }}/model-gateway" "dist/$ASSET_STEM"
          install -m 644 README.md dist/README.md
          install -m 755 darwin/install-launchd.sh dist/install-launchd.sh
          install -m 644 darwin/com.claudecode.model-gateway.plist.template dist/com.claudecode.model-gateway.plist.template
          tar -czf "dist/$ASSET_STEM.tar.gz" \
            -C dist \
            "$ASSET_STEM" README.md install-launchd.sh com.claudecode.model-gateway.plist.template

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.names.outputs.asset_stem }}
          path: |
            dist/${{ steps.names.outputs.asset_stem }}
            dist/${{ steps.names.outputs.asset_stem }}.tar.gz

      - name: Publish GitHub release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/${{ steps.names.outputs.asset_stem }}
            dist/${{ steps.names.outputs.asset_stem }}.tar.gz
