name: release-windows

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -B build -S . -A x64

      - name: Build Release
        run: cmake --build build --config Release

      - name: Prepare package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item build/Release/model-gateway.exe dist/
          Copy-Item README.md dist/
          $packageItems = @('dist/model-gateway.exe', 'dist/README.md')
          if (Test-Path start.bat) {
            Copy-Item start.bat dist/
            $packageItems += 'dist/start.bat'
          }
          Compress-Archive -Path $packageItems -DestinationPath dist/claudecode-provider-flattener-windows-x64.zip -Force

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: claudecode-provider-flattener-windows-x64
          path: |
            dist/model-gateway.exe
            dist/claudecode-provider-flattener-windows-x64.zip

      - name: Publish GitHub release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/model-gateway.exe
            dist/claudecode-provider-flattener-windows-x64.zip